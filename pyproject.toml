[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4", "anthropic==0.111.0"]

[project.optional-dependencies]
graph = ["langgraph==1.2.20"]
db = ["sqlalchemy==2.1.6", "alembic==1.20.1"]
mcp = ["mcp==1.30.0", "langgraph==1.2.20"]   # the server runs the graph engine

[project.scripts]
veritas-mcp = "veritas.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: needs a live model (opt in with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 160

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
