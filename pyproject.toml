[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4", "anthropic==0.111.0"]

[project.optional-dependencies]
graph = ["langgraph==1.2.20"]
db = ["sqlalchemy==2.1.6", "alembic==1.20.1"]
api = ["fastapi==0.161.1", "uvicorn==0.54.0", "httpx==0.28.1", "sqlalchemy==2.1.6", "alembic==1.20.1", "langgraph==1.2.20"]   # httpx: FastAPI TestClient
postgres = ["psycopg[binary]==3.3.6"]
langchain = ["langchain==1.4.7", "langchain-core==1.7.0", "mcp==1.30.0", "langgraph==1.2.20"]   # bring your own chat model (see langchain_tools.py)
mcp = ["mcp==1.30.0", "langgraph==1.2.20"]   # the server runs the graph engine

[project.scripts]
veritas-mcp = "veritas.mcp_server:main"
veritas-api = "veritas.api:main"
veritas-eval = "veritas.evalkit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: needs a live model (opt in with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 160

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
