[project]
name = "veritas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4", "anthropic==0.111.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: needs a live model (opt in with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 160

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
